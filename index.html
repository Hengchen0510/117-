const calendar=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
const dayKey=(date=new Date())=>calendar.format(date);
const dayNumber=value=>Date.parse(value+'T00:00:00Z')/86400000;
const validDay=value=>/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(dayNumber(value))&&new Date(dayNumber(value)*86400000).toISOString().slice(0,10)===value;
const dayDiff=(from,to)=>dayNumber(to)-dayNumber(from);
const addDays=(from,count)=>new Date((dayNumber(from)+count)*86400000).toISOString().slice(0,10);

const empty=()=>({settings:{},checks:{},errors:{},proofs:{},logs:{},questions:{},attempts:{},materials:{}});
const values=group=>Object.values(group??{});
const scopeOf=data=>new Set(data.settings.plan?.scope??chapters.map(row=>row[0]));
const questionBank=data=>[...practice,...Object.entries(data.questions).map(([id,item])=>({...item,id}))];
function stageFor(exam,today) {
 if(!validDay(exam??''))return {stage:0,days:null};
 const days=dayDiff(today,exam);
 return {days,stage:days>28?0:days>14?1:days>5?2:3};
}
const unresolved=entry=>entry.status!=='solo';
function priorities(data,today,stageOverride) {
 const timing=stageFor(data.settings.plan?.exam,today);
 const stage=stageOverride??timing.stage;
 const scope=scopeOf(data);
 const mistakes=Object.entries(data.errors).map(([id,x])=>({...x,id})).filter(x=>scope.has(x.chapter)||x.chapter==='method');
 const due=mistakes.filter(x=>x.next<=today).sort((a,b)=>a.next.localeCompare(b.next));
 const proofGaps=values(data.proofs).filter(x=>unresolved(x)&&scope.has(x.chapter));
 const notes=values(data.materials).filter(x=>!x.resolved&&scope.has(x.chapter));
 const logs=values(data.logs).filter(x=>x.date<=today&&dayDiff(x.date,today)<7);
 const ranked=tasks.filter(t=>t.chapter==='method'||scope.has(t.chapter)).map(t=>{
  const related=mistakes.filter(e=>e.chapter===t.chapter&&unresolved(e));
  const dueInChapter=due.filter(e=>e.chapter===t.chapter);
  const errorType=focus.find(f=>f[0]===t.focus)?.[1];
  const recurring=mistakes.filter(e=>e.category===errorType&&unresolved(e)&&(t.chapter==='method'||e.chapter===t.chapter));
  const relatedProofs=t.focus==='proof'||t.focus==='cases'?proofGaps.filter(e=>t.chapter==='method'||e.chapter===t.chapter):[];
  const relatedNotes=t.focus==='notes'?notes.filter(e=>t.chapter==='method'||e.chapter===t.chapter):[];
  const switching=t.focus==='switch'?logs.reduce((sum,entry)=>sum+Number(entry.switches||0),0):0;
  const pressure=Math.min(6,related.length*2)+Math.min(9,dueInChapter.length*4)+Math.min(8,recurring.length*3)+Math.min(6,relatedProofs.length*2)+Math.min(6,relatedNotes.length*3)+Math.min(8,switching*2);
  const reason=dueInChapter.length?'本章有 '+dueInChapter.length+' 道到期错题':recurring.length?'记录了 '+recurring.length+' 次同类错误':relatedProofs.length?'有 '+relatedProofs.length+' 道证明仍需补写':relatedNotes.length?'有 '+relatedNotes.length+' 条讲义卡点待补查':switching?'过去 7 天记录了 '+switching+' 次资料切换':related.length?'本章有 '+related.length+' 道尚未独立重做':t.stage>stage?'后续阶段再安排':t.extra?'拓展任务':'本阶段基础任务';
  const completed=!!data.checks[t.id];
  return {...t,pressure,reason,done:completed,score:t.weight*4+pressure+(t.stage===stage?4:0)-Math.max(0,t.stage-stage)*7-(t.extra?14:0)};
 }).sort((a,b)=>b.score-a.score||a.mins-b.mins);
 const pending=ranked.filter(t=>!t.done);
 const eligible=pending.filter(t=>(!t.extra&&t.stage<=stage)||(t.pressure>=6&&(!t.extra||stage<3)));
 const eligibleIds=new Set(eligible.map(t=>t.id));
 const selected=eligible.slice(0,stage===3?4:6);
 const selectedIds=new Set(selected.map(t=>t.id));
 const later=pending.filter(t=>!selectedIds.has(t.id)).map(t=>({...t,reason:eligibleIds.has(t.id)?'本轮任务已排满，可在完成后递补':t.reason}));
 const bank=questionBank(data).filter(q=>scope.has(q.chapter)&&!data.attempts[q.id]?.solo);
 bank.sort((a,b)=>Number(b.source==='exam')-Number(a.source==='exam')||Number(due.some(e=>e.chapter===b.chapter))-Number(due.some(e=>e.chapter===a.chapter)));
 return {ranked,selected,later,due,proofGaps,bank,stage,days:timing.days};
}

const short=(v,max,required=false)=>typeof v==='string'&&v.length<=max&&(!required||v.trim().length>0);
const validChapter=v=>v==='method'||chapters.some(c=>c[0]===v);
const status=v=>['pending','hinted','solo'].includes(v);
const nonNegative=(value,max)=>typeof value!=='boolean'&&value!==null&&Number.isInteger(Number(value))&&Number(value)>=0&&Number(value)<=max;
function validRecord(group,value){
 if(group==='checks')return value===true;
 if(!value||typeof value!=='object'||Array.isArray(value))return false;
 if(group==='settings')return (!value.exam||validDay(value.exam))&&Array.isArray(value.scope)&&value.scope.every(x=>chapters.some(c=>c[0]===x));
 if(group==='errors')return short(value.title,1500,true)&&validChapter(value.chapter)&&short(value.topic,300,true)&&short(value.mine,5000,true)&&errors.includes(value.category)&&short(value.correct,5000,true)&&status(value.status)&&validDay(value.next)&&short(value.questionId??'',80);
 if(group==='proofs')return short(value.title,1500,true)&&validChapter(value.chapter)&&short(value.given,5000,true)&&short(value.goal,5000,true)&&short(value.bridge,5000,true)&&short(value.gap,5000)&&short(value.shorter,5000)&&status(value.status)&&validDay(value.date);
 if(group==='logs')return validDay(value.date)&&nonNegative(value.minutes,1440)&&Number(value.minutes)>0&&short(value.goal,1000,true)&&short(value.source,300,true)&&nonNegative(value.switches,100)&&short(value.blocker,2000)&&short(value.next,2000);
 if(group==='questions')return value.source==='exam'&&short(value.year,40,true)&&short(value.number,100,true)&&short(value.paper,250)&&chapters.some(c=>c[0]===value.chapter)&&types.includes(value.type)&&short(value.topic,300,true)&&short(value.prompt,6000,true)&&short(value.hint,6000);
 if(group==='attempts')return typeof value.solo==='boolean'&&validDay(value.date);
 if(group==='materials')return validChapter(value.chapter)&&short(value.source,300,true)&&short(value.location,200,true)&&short(value.line,2000,true)&&short(value.rewrite,4000)&&short(value.example,2000)&&typeof value.resolved==='boolean';
 return false;
}
function validKey(group,id) {
 return Object.hasOwn(empty(),group)&&typeof id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(id)&&
  !['__proto__','constructor','prototype'].includes(id)&&(group!=='settings'||id==='plan')&&(group!=='checks'||tasks.some(t=>t.id===id));
}

   const payload=JSON.parse(await file.text());
   if(payload.version!==1||!payload.data||typeof payload.data!=='object')throw Error('format');
   const imported=empty();
   for(const group of Object.keys(imported)){
    for(const [id,value] of Object.entries(payload.data[group]??{})){
     if(!validKey(group,id)||!validRecord(group,value))throw Error('record');
     imported[group][id]=value;

 });

}

 const body=entries.map(x=>'<tr><td><b>'+e(x.line)+'</b><div class="meta">'+e(chapterName(x.chapter))+' · '+e(x.source)+' · '+e(x.location)+'</div></td><td>'+e(x.rewrite||'—')+'</td><td>'+e(x.example||'—')+'</td><td>'+chip(x.resolved?'已弄懂':'待补查',x.resolved?'green':'amber')+'</td><td>'+btn('编辑','material-edit',x.id)+'</td></tr>').join('');
 const src=Object.values(sources).map(s=>'<div class="source-card"><b>'+s.label+'</b><p>'+s.note+'</p><a href="'+s.url+'" target="_blank" rel="noopener">'+s.name+' ↗</a></div>').join('');
 const chapterTable=table(['章节','当前讲义','补查讲义'],chapters.map(c=>'<tr><td>'+e(c[1])+'</td><td>'+e(c[2])+'</td><td>'+e(c[3])+'</td></tr>').join(''),'');
 return heading('COURSE MATERIALS','资料与笔记','先回到老师讲义定位一行卡住的内容，再决定是否需要补查。',btn('＋ 记笔记卡点','material-new','','primary'))+'<div class="split">'+panel('主线与补查','一次复习只从主资料开工。',src)+panel('章节索引','两份讲义的组织方式不同，以当前课程要求为准。',chapterTable)+'</div><div class="spaced">'+panel('老师笔记卡','记录原句与页码，再用自己的话重述并给出例子。',table(['卡住的一行','定义 / 前提 / 结论','验证例子','状态','操作'],body,msg('还没有笔记卡','先录入一个你读不懂的符号、定义或推导。',btn('记一条卡点','material-new'))))+'</div>';
}
function settingsView(){
 const active=scopeOf(data);
 const checkboxes=chapters.map(c=>'<label><input type="checkbox" name="scope" value="'+c[0]+'"'+(active.has(c[0])?' checked':'')+'> '+e(c[1])+'</label>').join('');
 const backup=panel('本地备份','记录保存在当前浏览器。更换设备或清理浏览器数据前，可导出一份备份。','<div class="actions">'+btn('导出学习记录','backup-export')+btn('导入学习记录','backup-import')+'</div>');
 return heading('EXAM SETTINGS','考试设置','填入正式考试日期，并按老师公布的范围选择章节。')+'<div class="stack">'+panel('日期与范围','以北京时间计算剩余天数。学习方法任务始终保留。','<form id="settings-form"><div class="form-grid">'+field('期末考试日期','exam',data.settings.plan?.exam??'',{required:false,max:10,placeholder:'YYYY-MM-DD',help:'可直接输入，例如 2026-12-18。留空可清除考试日期。'})+'<div class="field wide"><span>考试范围</span><div class="check-grid">'+checkboxes+'</div><small>未勾选章节会从计划中移除，既有记录仍可查看。</small></div></div><p class="form-error" hidden role="alert"></p><div class="form-actions"><button class="button primary" type="button" data-action="settings-save">保存考试设置</button></div></form>')+backup+'</div>';
}
const views={home:overview,plan:planView,practice:practiceView,errors:errorsView,proofs:proofsView,logs:logsView,materials:materialsView,settings:settingsView};
function render(passive=false){
 const active=page();
 if(passive&&($('dialog').open||document.activeElement?.matches('input,textarea,select')))return;
 const p=plan();
 const mk=([id,label,ico])=>'<a class="nav-link '+(active===id?'active':'')+'" href="#'+id+'"'+(active===id?' aria-current="page"':'')+'>'+icon(ico)+e(label)+(id==='errors'&&p.due.length?'<span class="nav-count">'+p.due.length+'</span>':'')+'</a>';
 $('nav').innerHTML=nav.slice(0,6).map(mk).join('');
 $('secondary-nav').innerHTML=nav.slice(6).map(mk).join('');
 $('top-date').textContent=dateLabel.format(new Date());
 $('crumb-page').textContent=nav.find(x=>x[0]===active)[1];
 $('main').innerHTML=views[active]();
 if(active==='practice')updatePractice();
}

function field(label,name,value='',opts={}){
 const {type='text',options,wide=false,required=true,help='',max=5000,min,placeholder=''}=opts;
 const common=' name="'+name+'"'+(required?' required':'')+' placeholder="'+attr(placeholder)+'"';
 const control=options?'<select'+common+'>'+opt(options,value)+'</select>':type==='textarea'?'<textarea'+common+' maxlength="'+max+'">'+e(value)+'</textarea>':type==='checkbox'?'<input type="checkbox" name="'+name+'"'+(value?' checked':'')+'>':'<input type="'+type+'"'+common+' value="'+attr(value)+'"'+(type==='number'?' min="'+(min??0)+'" max="'+max+'" step="1"':' maxlength="'+max+'"')+'>';
 return '<label class="field '+(wide?'wide':'')+'"><span>'+label+'</span>'+control+(help?'<small>'+help+'</small>':'')+'</label>';
}
function show(title,sub,body){
 const d=$('dialog');
 d.innerHTML='<div class="dialog-head"><div><h2 id="dialog-title">'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div><button type="button" class="iconbtn" data-action="close" aria-label="关闭">×</button></div>'+body;
 if(!d.open)d.showModal();
 else d.scrollTop=0;
}
const close=()=>{$('dialog').close();};
function form(title,sub,group,id,body){
 show(title,sub,'<form id="record-form" data-group="'+group+'" data-id="'+attr(id)+'"><div class="form-grid">'+body+'</div><p class="form-error" hidden role="alert"></p><div class="form-actions">'+(id?'<button type="button" class="button danger" data-action="delete-ask" data-group="'+group+'" data-id="'+attr(id)+'">删除</button>':'')+'<button type="button" class="button outline" data-action="close">取消</button><button type="submit" class="button primary">保存</button></div></form>');
}
function errorForm(id='',q){
 const x=data.errors[id]??{};
 form(id?'编辑错题':'记录错题','先把当时怎么想的写下来，再补正确思路。','errors',id,
 field('题目','title',x.title??q?.prompt??'',{type:'textarea',wide:true,max:1500})+
 field('所属章节','chapter',x.chapter??q?.chapter??'logic',{options:[...chOpts,['method','学习方法']]})+
 field('考查知识点','topic',x.topic??q?.topic??'',{max:300})+
 field('我的解法','mine',x.mine??'',{type:'textarea',wide:true,placeholder:'写实际做过的第一步。如果没有起手，记录卡住的原因。'})+
 field('错误类型','category',x.category??errors[0],{options:errors})+
 field('是否能独立重做','status',x.status??'pending',{options:statusOpts})+
 field('正确思路','correct',x.correct??'',{type:'textarea',wide:true,placeholder:'记录下一次起手该做什么，以及关键一步。'})+
 field('下次复习日期','next',x.next??addDays(currentDay,1),{type:'date'})+
 '<input type="hidden" name="questionId" value="'+attr(x.questionId??q?.id??'')+'">');
}
function proofForm(id='',q){
 const x=data.proofs[id]??{};
 form(id?'编辑证明复盘':'复盘一道证明题','可以只写简洁的证明骨架，但每个关键推导都要能说出依据。','proofs',id,
 field('题目','title',x.title??q?.prompt??'',{type:'textarea',wide:true,max:1500})+
 field('所属章节','chapter',x.chapter??q?.chapter??'logic',{options:chOpts})+
 field('复盘日期','date',x.date??currentDay,{type:'date'})+
 field('已知条件','given',x.given??'',{type:'textarea'})+
 field('待证结论','goal',x.goal??'',{type:'textarea'})+
 field('关键推导及依据','bridge',x.bridge??'',{type:'textarea',wide:true,placeholder:'哪条定义或定理把条件连到了结论？'})+
 field('我漏写的一步','gap',x.gap??'',{type:'textarea',required:false,placeholder:'量词、变量范围、定理前提，或推导理由。'})+
 field('更简洁的证明路线','shorter',x.shorter??'',{type:'textarea',required:false,placeholder:'试一个统一估计、构造或反证，比较它与原解。'})+
 field('闭卷独立重做','status',x.status??'pending',{options:statusOpts}));
}
function logForm(id=''){
 const x=data.logs[id]??{};
 form(id?'编辑学习记录':'记录一次学习','一天下来可以记多次。主资料与切换次数会帮助下一轮排序。','logs',id,
 field('学习日期','date',x.date??currentDay,{type:'date'})+
 field('学习分钟数','minutes',x.minutes??25,{type:'number',min:1,max:1440})+
 field('完成内容或学习目标','goal',x.goal??'',{wide:true,max:1000})+
 field('主资料','source',x.source??sources.main.name,{max:300})+
 field('切换资料次数','switches',x.switches??0,{type:'number',max:100})+
 field('卡在哪里','blocker',x.blocker??'',{type:'textarea',required:false,max:2000})+
 field('下次先做什么','next',x.next??'',{type:'textarea',required:false,max:2000}));
}
function materialForm(id=''){
 const x=data.materials[id]??{};
 form(id?'编辑笔记卡':'记录讲义卡点','记下最小的一处卡点，补查完成后回到主讲义。','materials',id,
 field('所属章节','chapter',x.chapter??'logic',{options:chOpts})+
 field('主讲义或课件名','source',x.source??sources.main.name,{max:300})+
 field('页码、节号或行号','location',x.location??'',{max:200})+
 field('卡住的一行','line',x.line??'',{type:'textarea',wide:true,max:2000})+
 field('用自己的话重述','rewrite',x.rewrite??'',{type:'textarea',wide:true,max:4000,required:false,help:'写定义、前提和结论。'})+
 field('检验用的例子或反例','example',x.example??'',{type:'textarea',wide:true,max:2000,required:false})+
 field('已弄懂这一步','resolved',x.resolved??false,{type:'checkbox',required:false}));
}
function questionForm(id=''){
 const x=data.questions[id]??{};
 form(id?'编辑期末真题':'录入一道期末真题','按实际试卷填写年份、题号与来源。每个小问可以单独录入。','questions',id,
 field('年份 / 学年','year',x.year??'',{max:40,placeholder:'例如 2025–26'})+
 field('卷名 / 场次','paper',x.paper??'',{max:250,required:false})+
 field('题号','number',x.number??'',{max:100,placeholder:'例如 2(b)'})+
 field('所属章节','chapter',x.chapter??'logic',{options:chOpts})+
 field('题型','type',x.type??types[0],{options:types})+
 field('知识点','topic',x.topic??'',{max:300})+
 field('题干','prompt',x.prompt??'',{type:'textarea',wide:true,max:6000})+
 field('参考思路或答案','hint',x.hint??'',{type:'textarea',wide:true,max:6000,required:false}));
}
function bulk(){
 const example=[{year:'请填写实际年份',paper:'卷名',number:'1(a)',chapter:'logic',type:'证明题',topic:'知识点',prompt:'在这里替换成原题题干',hint:''}];
 show('批量导入期末真题','每个对象对应一道题。此入口接收结构化 JSON。', '<form id="bulk-form"><p class="form-hint">章节代码 '+chOpts.map(([k,v])=>k+'＝'+v).join('、')+'。题型 '+types.join('、')+'。</p>'+field('题目 JSON 数组','bulk','',{type:'textarea',wide:true,max:180000,help:'可复制示例结构。请填写真实试卷信息。'})+'<details class="subdetail"><summary>查看格式示例</summary><p>'+e(JSON.stringify(example,null,2))+'</p></details><p class="form-error" hidden role="alert"></p><div class="form-actions"><button type="submit" class="button primary">导入题目</button></div></form>');
}
function questionDialog(q){
 const done=data.attempts[q.id]?.solo;
 show(e(q.topic),paperRef(q),' <div class="inline-tags">'+chip(chapterName(q.chapter),'blue')+chip(q.type)+chip(sourceNames[q.source],'purple')+(done?chip('已独立做出','green'):'')+'</div><article class="record-card spaced"><p>'+e(q.prompt)+'</p></article><details class="subdetail spaced"><summary>查看参考思路</summary><p>'+e(q.hint||'这道题尚未录入参考思路。')+'</p></details><div class="form-actions">'+(q.source==='exam'?btn('编辑真题','question-edit',q.id):'')+(q.type==='证明题'?btn('复盘证明','proof-from',q.id):'')+btn('记错题','error-from',q.id)+btn(done?'撤销独立完成':'标记独立完成','question-done',q.id,'primary')+'</div>');
}
function errorDialog(x,retry){
 const title=retry?'闭卷重做':'错题详情';
 const followUp=retry?'<form id="redo-form" data-id="'+attr(x.id)+'" class="spaced"><div class="form-grid">'+field('本次重做结果','status',x.status,{options:statusOpts})+field('下次复习日期','next',addDays(currentDay,1),{type:'date',help:'若选可独立完成且日期沿用默认，会自动推迟到 7 天后。'})+'</div><div class="form-actions"><button class="button primary" type="submit">保存重做结果</button></div></form>':'<div class="form-actions">'+btn('编辑','error-edit',x.id)+btn('开始重做','redo',x.id,'primary')+'</div>';
 show(title,e(chapterName(x.chapter)+' · '+x.topic),'<article class="record-card"><div class="inline-tags">'+chip(x.category,'amber')+statusChip(x.status)+'</div><p class="spaced">'+e(x.title)+'</p><details class="subdetail"><summary>查看我的原解法</summary><p>'+e(x.mine)+'</p></details><details class="subdetail"><summary>查看正确思路</summary><p>'+e(x.correct)+'</p></details></article>'+followUp);
}
function proofDialog(x){
 show(e(x.title),e(chapterName(x.chapter)+' · '+x.date),'<article class="record-card">'+statusChip(x.status)+[['已知条件',x.given],['待证结论',x.goal],['关键推导',x.bridge],['漏写的一步',x.gap],['更简洁的路线',x.shorter]].map(([k,v])=>'<h3>'+k+'</h3><p>'+e(v||'—')+'</p>').join('')+'</article><div class="form-actions">'+btn('编辑复盘','proof-edit',x.id,'primary')+'</div>');
}
function toast(message){
 const t=$('toast');
 t.textContent=message;
 t.hidden=false;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{t.hidden=true;},2800);
}
function formError(form,message){
 const el=form.querySelector('.form-error');
 el.textContent=message; el.hidden=false;
}
const question=id=>questionBank(data).find(q=>q.id===id);
function saveSettings(form){
 const input=new FormData(form);
 const exam=String(input.get('exam')??'').trim();
 const settings={exam,scope:input.getAll('scope')};
 if(!validRecord('settings',settings)){
  formError(form,'请输入有效的考试日期，格式为 YYYY-MM-DD。');
  return;
 }
 phaseOverride=undefined;
 const saved=change('settings','plan',settings);
 toast(saved?'考试设置已保存':'本次设置已生效，但浏览器无法保存。可导出学习记录备份。');
}
const commands={
 'settings-save':()=>saveSettings($('settings-form')),
 "backup-export":exportBackup,
 "backup-import":importBackup,
 menu:()=>$('sidebar').classList.toggle('open'),
 close,
 phase:id=>{phaseOverride=Number(id);render();},
 'plan-tab':id=>{planMode=id;render();},
 'practice-group':id=>{practiceFilters.group=id;render();},
 'error-new':()=>errorForm(),
 'error-from':id=>errorForm('',question(id)),
 'error-open':id=>errorDialog({...data.errors[id],id},false),
 'error-edit':id=>errorForm(id),
 redo:id=>errorDialog({...data.errors[id],id},true),
 'proof-new':()=>proofForm(),
 'proof-from':id=>proofForm('',question(id)),
 'proof-open':id=>proofDialog({...data.proofs[id],id}),
 'proof-edit':id=>proofForm(id),
 'log-new':()=>logForm(),
 'log-edit':id=>logForm(id),
 'material-new':()=>materialForm(),
 'material-edit':id=>materialForm(id),
 'question-new':()=>questionForm(),
 'question-edit':id=>questionForm(id),
 'question-open':id=>questionDialog(question(id)),
 'question-done':id=>{change('attempts',id,{date:currentDay,solo:!data.attempts[id]?.solo});questionDialog(question(id));toast(data.attempts[id].solo?'已标记独立完成':'已撤销独立完成');},
 'bulk-new':bulk,
 'delete-ask':(id,group)=>show('删除'+groupLabel[group],'删除后，这条记录将从复习台移除。','<div class="form-actions"><button type="button" class="button outline" data-action="close">取消</button><button type="button" class="button danger" data-action="delete" data-group="'+group+'" data-id="'+attr(id)+'">确认删除</button></div>'),
 delete:(id,group)=>{close();change(group,id,null);toast('已删除'+groupLabel[group]);}
};
document.addEventListener('click',event=>{
 const trigger=event.target.closest('[data-action]');
 if(trigger){event.preventDefault();commands[trigger.dataset.action]?.(trigger.dataset.id,trigger.dataset.group);return;}
 if(event.target.closest('.side a'))$('sidebar').classList.remove('open');
 else if(!event.target.closest('#sidebar')&&$('sidebar').classList.contains('open'))$('sidebar').classList.remove('open');
});
const filterIds={'p-source':'source','p-chapter':'chapter','p-type':'type','p-year':'year','p-attempt':'attempt'};
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.dataset.check){
  change('checks',target.dataset.check,target.checked?true:null);
  if(target.checked)toast('已完成，计划已更新');
  $('check-'+target.dataset.check)?.focus({preventScroll:true});
 }else if(Object.hasOwn(filterIds,target.id)){
  practiceFilters[filterIds[target.id]]=target.value;updatePractice();
 }else if(target.id==='e-status'){errorFilter=target.value;render();}
 else if(target.id==='e-chapter'){errorChapter=target.value;render();}
 else if(target.id==='log-mode'){logMode=target.value;render();}
});
document.addEventListener('input',event=>{if(event.target.id==='p-search'){practiceFilters.search=event.target.value;updatePractice();}});
const unique=()=>crypto.randomUUID?.()??'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function keyForQuestion(x){
 const key=[x.year,x.paper,x.number].map(s=>s.normalize('NFKC').trim().toLowerCase()).join('|');
 const hit=values(data.questions).find(q=>[q.year,q.paper,q.number].map(s=>s.normalize('NFKC').trim().toLowerCase()).join('|')===key);
 return {key,hit};
}
document.addEventListener('submit',event=>{
 const f=event.target;
 if(!['record-form','settings-form','redo-form','bulk-form'].includes(f.id))return;
 event.preventDefault();
 if(f.id==='settings-form'){saveSettings(f);return;}
 const input=new FormData(f);
 const raw=Object.fromEntries([...input].map(([k,v])=>[k,String(v).trim()]));
 if(f.id==='redo-form'){
  const id=f.dataset.id;
  const next=raw.status==='solo'&&raw.next===addDays(currentDay,1)?addDays(currentDay,7):raw.next;
  change('errors',id,{...data.errors[id],status:raw.status,next});
  close();toast('已更新重做结果和复习计划');return;
 }
 if(f.id==='bulk-form'){
  let list;
  try{list=JSON.parse(raw.bulk);}catch{formError(f,'无法读取 JSON，请检查标点和引号。');return;}
  if(!Array.isArray(list)||!list.length||list.length>100){formError(f,'每次请输入 1 至 100 道题的数组。');return;}
  const items=list.map(q=>{
   const item=Object.fromEntries(['year','paper','number','chapter','type','topic','prompt','hint'].map(k=>[k,typeof q?.[k]==='string'?q[k].trim():'']));
   return {...item,source:'exam'};
  });
  const invalid=items.findIndex(q=>!validRecord('questions',q));
  if(invalid>=0){formError(f,'第 '+(invalid+1)+' 项缺少必填内容，或章节代码、题型无效。');return;}
  const seen=new Set();
  let added=0;
  for(const item of items){
   const {key,hit}=keyForQuestion(item);
   if(hit||seen.has(key))continue;
   seen.add(key);change('questions',unique(),item);added++;
  }
  close();toast('已导入 '+added+' 道，跳过 '+(items.length-added)+' 道重复题');return;
 }
 const group=f.dataset.group,id=f.dataset.id||unique();
 const value={...raw};
 if(group==='materials')value.resolved=input.has('resolved');
 if(group==='questions'){
  value.source='exam';
  const old=data.questions[id], same=old&&['year','paper','number'].every(k=>value[k]===old[k]);
  if(!same&&keyForQuestion(value).hit){formError(f,'已有同年份、卷名与题号的真题。请从题库编辑原题。');return;}
 }
 if(!validRecord(group,value)){formError(f,'请检查必填内容、日期和数值，再保存。');return;}
 close();change(group,id,value);toast('已保存'+groupLabel[group]);
});
window.addEventListener('hashchange',()=>{
 phaseOverride=undefined;render();window.scrollTo(0,0);$('main').focus({preventScroll:true});
});
window.addEventListener('online',sync);
window.addEventListener('focus',()=>{
 const today=dayKey();
 if(today!==currentDay){currentDay=today;render(true);}
 sync();
});
setInterval(()=>{const today=dayKey();if(today!==currentDay){currentDay=today;render(true);}},30000);
render();
sync();

</script>
</body>
